apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cavalocal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: cavalocal-backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: NODE_ENV
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: JWT_EXPIRES_IN
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: CORS_ORIGINS
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: RABBITMQ_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: BACKEND_DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: GOOGLE_CLIENT_ID
            - name: MAIL_USER
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: MAIL_USER
            - name: MAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vinos-secret
                  key: MAIL_APP_PASSWORD
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cavalocal
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
