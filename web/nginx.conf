server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ruta principal → index.html del frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ruta /dashboard también sirve el frontend
    location /dashboard {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|mp4|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
