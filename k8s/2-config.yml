# Variables no sensibles comunes a todos los microservicios
apiVersion: v1
kind: ConfigMap
metadata:
  name: cavalocal-config
  namespace: cavalocal
data:
  NODE_ENV: "production"
  PORT_BACKEND: "3001"
  PORT_AUDIT: "3002"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_QUEUE: "audit_queue"
  JWT_EXPIRES_IN: "1d"
  CORS_ORIGINS: "*"
---
# Valores sensibles — mismas credenciales que docker-compose/.env
apiVersion: v1
kind: Secret
metadata:
  name: vinos-secret
  namespace: cavalocal
type: Opaque
stringData:
  RABBITMQ_PASSWORD: "guest"
  # URL de BD: el host "db-cavalocal" es el Service de K8s (puerto interno 5432).
  # En docker-compose era localhost:5433 (mapping host), en K8s es db-cavalocal:5432.
  DATABASE_URL: "postgresql://postgres:postgrespassword@db-cavalocal:5432/cavalocal?schema=public"
  JWT_SECRET: "secreto-super-seguro-cavalocal"
  GOOGLE_CLIENT_ID: "TU_GOOGLE_CLIENT_ID"
  MAIL_USER: "tu-correo@gmail.com"
  MAIL_APP_PASSWORD: "TU_APP_PASSWORD_16_CHARS"